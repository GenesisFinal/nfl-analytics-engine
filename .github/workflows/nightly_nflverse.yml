name: Nightly nflverse Valuation & AI Critiques

on:
  schedule:
    # Ejecución diaria a las 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nfl-data-pipeline
  cancel-in-progress: false

jobs:
  nightly-valuation-and-critiques:
    name: Run nflverse Valuation, AI Critiques & Deploy Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest ESPN Live Scoreboard & Win Probability
        run: python -m src.ingest_espn

      - name: Run nflverse Play-by-Play Valuation Model (0-100)
        run: python -m src.valuation_model

      - name: Ingest 8-Source NFL News & Salary Cap Wire
        run: python -m src.ingest_news

      - name: Generate Quantitative Critiques (Gemini API / Deterministic Fallback)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.critic_generator

      - name: Validate Pipeline & Generated JSON Integrity with Pytest
        run: python -m pytest tests/ -v

      - name: Commit and Push Updated Static JSON Data
        id: commit_check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/*.json
          if git diff --cached --quiet; then
            echo "No data changes detected in public/data/*.json."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): nightly nflverse valuation & critiques update"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages
        if: steps.commit_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload artifact from /public
        if: steps.commit_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        if: steps.commit_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@v4
