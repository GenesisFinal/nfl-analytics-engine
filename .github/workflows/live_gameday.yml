name: Live Gameday ESPN Scoreboard & Win Probability

on:
  schedule:
    # Domingos y Sábados de NFL (13:00 a 23:59 UTC cada 5 minutos - cubre International Games 9:30 ET, 1:00 PM ET y 4:25 PM ET)
    - cron: '*/5 13-23 * * 0,6'
    # Ventanas nocturnas TNF / SNF / MNF (00:00 a 04:59 UTC en lunes, martes y viernes UTC)
    - cron: '*/5 0-4 * * 1,2,5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nfl-data-pipeline
  cancel-in-progress: false

jobs:
  update-live-scoreboard:
    name: Update ESPN Scoreboard & Deploy Live Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch ESPN Scoreboard & Extract Critical Moments (|delta_wp| >= 0.12)
        run: python -m src.ingest_espn

      - name: Ingest 8-Source NFL News & Salary Cap Wire
        run: python -m src.ingest_news

      - name: Commit and Push Updated Live Scoreboard & News JSON
        id: commit_check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/live_scoreboard.json public/data/nfl_news.json
          if git diff --cached --quiet; then
            echo "No changes in public/data/live_scoreboard.json or nfl_news.json."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(live): update ESPN scoreboard, win probability & 8-source news wire"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages
        if: steps.commit_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload artifact from /public
        if: steps.commit_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        if: steps.commit_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@v4
