name: NFL Analytics Auto-Update (1h News / 30m Live Games)

on:
  schedule:
    # Se ejecuta cada 30 minutos: en :00 actualiza siempre (Noticias cada 1h) y en :30 actualiza si hay partidos en vivo
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-nfl-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check schedule condition (Hourly News vs 30-min Live NFL Games)
        id: check_run
        run: |
          python - << 'EOF'
          import datetime, json, os, requests
          now_min = datetime.datetime.utcnow().minute
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          should_run = True
          # Si es ejecucion automatica en el minuto ~30, verificamos si hay partido NFL en vivo o por iniciar
          if event_name == "schedule" and 15 <= now_min <= 45:
              should_run = False
              try:
                  r = requests.get("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard", timeout=10).json()
                  for ev in r.get("events", []):
                      st = ev.get("status", {}).get("type", {}).get("state", "")
                      if st == "in":
                          should_run = True
                          break
              except Exception:
                  should_run = True
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"should_run={'true' if should_run else 'false'}\n")
          EOF

      - name: Run NFL Stats, MNF Schedule & High-Impact News Ingestion
        if: steps.check_run.outputs.should_run == 'true'
        run: |
          python actualizar_datos_nfl.py
          python generador_tips_x.py

      - name: Commit and Push Updated Data to GitHub Pages
        if: steps.check_run.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nfl_dashboard_data.json data/nfl_dashboard_data.js
          git diff --staged --quiet || git commit -m "chore(data): auto-update NFL stats, live scoreboard & news [skip ci]"
          git push
